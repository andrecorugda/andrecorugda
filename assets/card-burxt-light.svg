<svg xmlns="http://www.w3.org/2000/svg" width="420" height="170" viewBox="0 0 420 170" role="img" aria-label="Burxt &#8212; Contract-first programming language">
  <rect x=".5" y=".5" width="419" height="169" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="1" y="14" width="4" height="40" rx="2" fill="#f97316"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="30" cy="34" r="6" fill="#f97316"/>
    <text x="44" y="40" font-size="19" font-weight="700" fill="#1f2328">Burxt</text>
    <text x="24" y="66" font-size="12.5" font-weight="600" fill="#c2410c">Contract-first programming language</text>
    <text x="24" y="92" font-size="13" fill="#59636e">A function's promises live in its signature,</text>
    <text x="24" y="110" font-size="13" fill="#59636e">and the compiler enforces every word.</text>
    <rect x="24" y="128" width="44" height="22" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="46" y="143" text-anchor="middle" font-size="11" fill="#59636e">Rust</text>
    <rect x="74" y="128" width="71" height="22" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="109.5" y="143" text-anchor="middle" font-size="11" fill="#59636e">Compiler</text>
    <rect x="151" y="128" width="110" height="22" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="206" y="143" text-anchor="middle" font-size="11" fill="#59636e">burxt-lang.org</text>
  </g>
</svg>
